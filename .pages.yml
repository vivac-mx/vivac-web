# Configuración del panel de edición (Pages CMS) de vivac.mx
# En GitHub este archivo debe llamarse ".pages.yml" (con punto) y estar en la raíz del repositorio.
media:
  input: img
  output: /img

content:
  - name: paquetes
    label: Paquetes a Cancún
    type: file
    path: datos/paquetes.json
    format: json
    fields:
      - name: paquetes
        label: Paquetes
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre del paquete
            type: string
            required: true
          - name: precio
            label: Precio (ej. Desde $18,500 MXN por persona)
            type: string
          - name: vigencia
            label: Vigencia (ej. Vigente hasta el 31 de enero)
            type: string
          - name: incluye
            label: Qué incluye (uno por renglón)
            type: string
            list: true
          - name: foto
            label: Foto principal
            type: image
          - name: foto_detalle
            label: Imagen decorativa encima (opcional)
            type: image
          - name: ocultar
            label: Ocultar temporalmente este paquete
            type: boolean

  - name: destinos
    label: Más destinos de México
    type: file
    path: datos/destinos.json
    format: json
    fields:
      - name: destinos
        label: Destinos
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre del destino
            type: string
            required: true
          - name: descripcion
            label: Descripción corta
            type: string
          - name: imagen
            label: Imagen (de preferencia PNG o WebP con fondo transparente)
            type: image
          - name: ocultar
            label: Ocultar temporalmente este destino
            type: boolean

  - name: textos
    label: Textos del sitio
    type: file
    path: datos/textos.json
    format: json
    fields:
      - name: inicio
        label: Sección de inicio
        type: object
        fields:
          - name: titulo
            label: Título principal
            type: string
          - name: texto
            label: Texto de apoyo
            type: text
          - name: nota
            label: Nota debajo de los botones
            type: text
      - name: paquetes
        label: Encabezado de paquetes
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: subtitulo
            label: Subtítulo
            type: text
      - name: destinos
        label: Encabezado de destinos
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: subtitulo
            label: Subtítulo
            type: text
